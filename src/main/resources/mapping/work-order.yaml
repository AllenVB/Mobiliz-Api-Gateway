# Work Order endpoints of the legacy "Yetkili Servis" API.
#
# NAMING STATUS — read before editing an exposed name.
#
#   Every name below comes from the team's English vocabulary as published in Notion on
#   2026-08-24, applied EXACTLY as written. Where their spelling is inconsistent with
#   their own other names, theirs is kept and the discrepancy is raised instead — see
#   docs/open-items.md. Inventing a name they did not write would be worse.
#
#   PATHS are the vocabulary's own, adopted on the team's instruction: the legacy paths
#   translated into English, with no version segment. A22 is closed.
#
# Reading the file: the key is always the legacy (Turkish) name, the value is the name
# this bridge exposes. Long form adds `type`, `values`, `nested` or `emptyStringAsNull`.
#
# The agreed vocabulary is FLAT. This project had exposed opaque CRM references as
# objects (`brand.id`, `fuelType.code`) so that resolving one later would add a field
# rather than change one; the agreed names are plain strings and the agreed names win.
# The cost of that is recorded once in E15 and is not re-argued per field.

resources:

  # --------------------------------------------------------------------------
  # Work order list
  # --------------------------------------------------------------------------
  # A28 CLOSED. This endpoint answered for the first time on 2026-08-24, against
  # `/servistalepleri/1` — `0` is the segment that hangs, which is why every earlier
  # attempt timed out after 125 seconds. Fourteen work orders came back, and their 27
  # Turkish names line up one-for-one with the 27 the vocabulary had already named.
  #
  # The pairing is by meaning, not by position: `oncelikli`→priority,
  # `orgBasTarihSaat`→orgStartDateTime, `kalanAltIsSayisi`→remainingSubTaskCount,
  # `talepKisi1Tel`→requesterPhone1 and so on all read correctly in both directions.
  # Position agrees as well, which is corroboration rather than the argument.
  #
  # NOTE the date format. This is the only payload in the API using US-style
  # `8/4/2026 12:06:00 PM` rather than ISO-8601 — a third date convention alongside the
  # naive `2026-08-24T14:59:26` seen elsewhere. Relayed as the string it is; converting
  # would mean guessing a locale. Raised as A38.
  work-order-list:
    method: GET
    exposedPath: /authorized-service/service-requests/{listFilter}
    legacyPath: /yetkiliservis/servistalepleri/{listFilter}
    response:
      unmapped: PASSTHROUGH_AND_REPORT
      fields:
        id: id
        srvNumarasi: srvNumber
        oncelikli: priority
        musteri: customer
        konu: subject
        hizmetLokasyonu: serviceLocation
        kalanAltIsSayisi: remainingSubTaskCount
        toplamIsSayisi: totalTaskCount
        musteriLokasyonu: customerLocation
        serinoliste: serialNoList
        teknikservis: technicalService
        sahibi: owner
        durum: status

        # The person who raised the request, and an optional second contact.
        talepKisi1Adi: requesterName1
        talepKisi1Tel: requesterPhone1
        talepKisi2Adi: requesterName2
        talepKisi2Tel: requesterPhone2

        # Dates, all in the US-style format noted above.
        orgBasTarihSaat: orgStartDateTime
        orgBitTarihSaat: orgEndDateTime
        olusturmatarihi: createdDate
        hedeftarih: targetDate
        tamamlanmaTarihi: completionDate
        tamamlanmaSuresi: completionDuration

        # The authorised service assigned to the work order; all null so far.
        yetkiliServisAdi: authorizedServiceName
        yetkiliServisTelefonu: authorizedServicePhone
        yetkiliServisIlgiliKisi: authorizedServiceContact
        yetkiliServisAdresi: authorizedServiceAddress

  # --------------------------------------------------------------------------
  # Lines of one work order  (result is an array)
  # --------------------------------------------------------------------------
  work-order-lines:
    method: GET
    exposedPath: /authorized-service/service-request-lines/{workOrderId}
    legacyPath: /yetkiliservis/servistalepsatirlari/{workOrderId}
    response:
      unmapped: PASSTHROUGH_AND_REPORT
      fields:
        detayId: detailId
        srvNumarasi: srvNumber
        plaka: plate
        serino: serialNo
        vendorCode: vendorCode
        gsm: gsm
        durum: status
        churn: churn
        ysozelnot: ysSpecialNote
        sahadestekok: fieldSupportOk
        bakimonarimok: maintenanceRepairOk
        # NOTE: a number here, but a string in servistalepsatiri, for the same option
        # set. Both are exposed as `serviceLocation`, so the JSON type of that field
        # differs between two endpoints of the same contract. Raised as A29.
        hizmetLokasyonu: serviceLocation
        sonServisFotolari:
          exposed: lastServicePhotos
          emptyStringAsNull: true
        montajDokumani:
          exposed: installationDocument
          emptyStringAsNull: true

  # --------------------------------------------------------------------------
  # One work order line, read and write
  # --------------------------------------------------------------------------
  work-order-line:
    method: GET
    exposedPath: /authorized-service/service-request-line/{detailId}
    legacyPath: /yetkiliservis/servistalepsatiri/{detailId}
    response:
      unmapped: PASSTHROUGH_AND_REPORT
      fields:
        plaka: plate
        serino: serialNo
        gsm: gsm
        canBusProfile: canBusProfile
        vendorCode: vendorCode
        stfFormNo: stfFormNo
        telOperator: phoneOperator
        apnYok: apnMissing
        km: km
        testHatti: testLine
        aracTipi: vehicleType
        yil: year
        marka: brand
        model: model
        motorHacmi: engineVolume
        yakitTuru: fuelType
        hizmetLokasyonu: serviceLocation
        # "şehir içi / şehir dışı" — inside or outside the city. Neither the legacy name
        # nor the agreed `inOutCity` says which value means which. Still A15.
        sehirIciDisi: inOutCity
        sehir: city
        ilce: district
        semt: neighborhood
        ysozelnot: ysSpecialNote
        plakakontrolsuz: plateUncontrolled
        yolbedelsiz: freeOfCharge
        churn: churn
        lastikmarka: tireBrand
        lastikebat: tireSize
        saseno: chassisNo
        otokocmu: isOtokoc

  # UNCONFIRMED TARGET — read this before relying on it.
  #
  # An earlier draft of the vocabulary documented this operation as
  # PUT /authorized-service/service-requests/0 — the same mistake the Hoppscotch
  # collection makes, since PUT /yetkiliservis/servistalepleri/0 answers 405 with
  # `Allow: GET`. **The completed vocabulary drops the operation entirely**: it is the
  # only write in the collection with no entry at all. That is either a deliberate
  # removal once the route was found to be read-only, or an omission. Tracked as A33.
  #
  # The endpoint is kept here rather than deleted, because the API does accept writes at
  # servistalepsatiri/{detayId} and the body is field-for-field that resource's response.
  # Deleting it would lose the work; keeping it flagged does not pretend it is verified.
  # The 2026-08-24 attempt was rejected for a malformed identifier — the saved request
  # carries the literal `0` — so no write has ever executed. Tracked as A9 and A19.
  work-order-line-update:
    method: PUT
    exposedPath: /authorized-service/service-request-line/{detailId}
    legacyPath: /yetkiliservis/servistalepsatiri/{detailId}
    request:
      unmapped: FAIL
      fields:
        plaka: plate
        serino: serialNo
        gsm: gsm
        canBusProfile: canBusProfile
        vendorCode: vendorCode
        stfFormNo: stfFormNo
        telOperator: phoneOperator
        apnYok: apnMissing
        km: km
        testHatti: testLine
        aracTipi: vehicleType
        yil: year
        marka: brand
        model: model
        motorHacmi: engineVolume
        yakitTuru: fuelType
        hizmetLokasyonu: serviceLocation
        sehirIciDisi: inOutCity
        sehir: city
        ilce: district
        semt: neighborhood
        ysozelnot: ysSpecialNote
        plakakontrolsuz: plateUncontrolled
        yolbedelsiz: freeOfCharge
        churn: churn
        lastikmarka: tireBrand
        lastikebat: tireSize
        saseno: chassisNo
        otokocmu: isOtokoc

  # --------------------------------------------------------------------------
  # Telematics status of the vehicle on a line
  # --------------------------------------------------------------------------
  # The vocabulary keeps this payload almost entirely as the legacy API sends it —
  # `canBusKM`, `lastGPSTime`, `canbusEngineRPM`, `DVR` and the whole tacho block are
  # unchanged. Only a handful are actually renamed. That is the team's call.
  vehicle-status:
    method: GET
    exposedPath: /authorized-service/vehicle-last-status/{detailId}
    legacyPath: /yetkiliservis/aracsondurum/{detailId}
    response:
      unmapped: PASSTHROUGH_AND_REPORT
      fields:
        plaka: plate
        serino: serialNo
        gsm: gsm
        emoveGsmNumber: emoveGsmNumber
        sunucukaydi: serverRecord
        sonAdresBilgisi: lastAddressInfo
        donanimBilgisi: hardwareInfo
        cihazYazilimVersiyonu: deviceSoftwareVersion
        mesafeSayaci: distanceCounter
        # A decimal delivered as a string ("13.24"), left as a string.
        anaBeslemeVoltaji: mainSupplyVoltage
        kontakAktivitesi: ignitionActivity
        immobilizer: immobilizer
        DVR: DVR

        # Timestamps. ISO-8601 without an offset — the bridge does not invent one.
        ilkVeriTarihi: firstDataDate
        sonVeriTarihi: lastDataDate
        lastGPSTime: lastGPSTime
        lastBulkGSensorTime: lastBulkGSensorTime
        lastMultiGpsTime: lastMultiGpsTime
        lastAccelerationandGpsTime: lastAccelerationandGpsTime

        # CAN bus.
        #
        # `canbusFuelLevel_TR` is applied as the vocabulary writes it. It is almost
        # certainly a working marker rather than a name anyone meant to publish: it is
        # the only name in the whole vocabulary with a language suffix, and it exists
        # only because the legacy payload carries two fuel-level fields —
        # `canbusYakitSeviyesi` and `canbusFuelLevel` — that nobody has told apart yet.
        # Naming the pair rather than resolving it keeps the ambiguity in the contract.
        # Raised as A30; A12 stays open underneath it.
        canbusok: canbusOk
        canbusHiz: canbusSpeed
        canBusKM: canBusKM
        canbusEngineRPM: canbusEngineRPM
        canbusYakitSeviyesi: canbusFuelLevel_TR
        canbusFuelLevel: canbusFuelLevel
        canbusLastFuelUsed: canbusLastFuelUsed
        canBusProfile:
          exposed: canBusProfile
          emptyStringAsNull: true

        # Tachograph. The vocabulary corrects the legacy misspelling
        # (`modularSensorTemprature` → `modularSensorTemperature`), which is exactly the
        # kind of thing this layer exists to do.
        lastTachoDriver1Cardno: lastTachoDriver1Cardno
        lastTachoDriver1Name: lastTachoDriver1Name
        lastCalibrationStatusDescription: lastCalibrationStatusDescription
        tachomodel: tachoModel
        tachoversion: tachoVersion
        modularSensorTemprature: modularSensorTemperature
        serialTemperature: serialTemperature

  # --------------------------------------------------------------------------
  # Feedback on a line
  # --------------------------------------------------------------------------
  # A18 is closed by the vocabulary: it documents `"feedbackReason": 6`, a number. The
  # captured failure — "Input string was not in a correct format." — was the free-text
  # value in the older document being rejected. The code list itself is still unknown.
  #
  # A32 RESOLVED, against the collection. The identifier is a work order, not one of
  # its lines: the revised vocabulary pairs `/feedback/{requsetId}` with
  # `/geribildirim/{talepId}`, and `talepId` is unambiguous — it is the same word the
  # work order line list uses for its parent. The collection's `detayId` was wrong.
  #
  # The variable is spelled `requestId` here rather than the vocabulary's `requsetId`.
  # A path variable name never appears in a URL — only in this template — so this is
  # documentation, not contract, and carrying an obvious transposition into it would
  # help nobody. The typo is reported rather than propagated.
  work-order-feedback:
    method: PUT
    exposedPath: /authorized-service/feedback/{requestId}
    legacyPath: /yetkiliservis/geribildirim/{requestId}
    request:
      unmapped: FAIL
      fields:
        geriBildirimNedeni: feedbackReason
        geriBildirimAciklama: feedbackDescription

  # --------------------------------------------------------------------------
  # Completion status  (a failure here still carries a payload)
  # --------------------------------------------------------------------------
  # A14 is closed: the vocabulary documents the success shape as `{"status": true}`, so
  # the captured `{"durumu": false}` is the same field with the failing value.
  work-order-line-completion-status:
    method: GET
    exposedPath: /authorized-service/device-completed/{detailId}
    legacyPath: /yetkiliservis/cihaztamamlandi/{detailId}
    response:
      unmapped: PASSTHROUGH_AND_REPORT
      fields:
        durumu: status

  # --------------------------------------------------------------------------
  # Completion writes
  # --------------------------------------------------------------------------
  # A10 CLOSED. "Complete work order" does exist, and its URL is the *write* side of
  # the completion-status endpoint: PUT /yetkiliservis/cihaztamamlandi/{detayId}, the
  # same path the GET above reads. The collection had it pointed at
  # /demontajtamamlandi/ — complete-demontage's URL — which is why every attempt
  # answered 411: that URL wants a body and none was sent.
  #
  # It takes no body of its own. The vocabulary notes that one must still be sent,
  # because an empty request is rejected by IIS with 411 before the application sees
  # it. That is the legacy API's problem, not the caller's: this bridge sends `{}`
  # when a write has nothing to say, so a caller never has to know.
  work-order-line-completion:
    method: PUT
    exposedPath: /authorized-service/device-completed/{detailId}
    legacyPath: /yetkiliservis/cihaztamamlandi/{detailId}

  work-order-line-demontage-completion:
    method: PUT
    exposedPath: /authorized-service/disassembly-completed/{detailId}
    legacyPath: /yetkiliservis/demontajtamamlandi/{detailId}
    request:
      unmapped: FAIL
      fields:
        cihazdurumu: deviceStatus
        contactname: contactName

  work-order-line-churn-completion:
    method: PUT
    exposedPath: /authorized-service/churn-completed/{detailId}
    legacyPath: /yetkiliservis/churntamamlandi/{detailId}
    request:
      unmapped: FAIL
      fields:
        # `teslimdurumu` is a numeric string here while `cihazdurumu` is a number in the
        # demontage request — the same kind of code, two different JSON types.
        teslimdurumu: deliveryStatus
        contactname: contactName
        rakipurun: competitorProduct
        # The legacy key genuinely contains a Turkish letter.
        diğer: other

  # --------------------------------------------------------------------------
  # DVR stream
  # --------------------------------------------------------------------------
  # No response mapping on purpose: `result` is a bare URL string, not an object, so
  # there are no names to translate. The engine passes scalars through unchanged.
  #
  # The legacy API reads the camera channel from a `channel` header. A channel belongs
  # in the URL, so the bridge exposes it as a query parameter and moves it into the
  # header on the way out: GET /authorized-service/dvr-last-status/{id}?channel=0
  #
  # SECURITY: the returned URL embeds a Mobiliz-Token credential. It must be relayed to
  # the caller but never written to a log.
  work-order-line-dvr-status:
    method: GET
    exposedPath: /authorized-service/dvr-last-status/{detailId}
    legacyPath: /yetkiliservis/DVRSonDurum/{detailId}
    legacyHeaders:
      channel:
        fromQuery: channel
        required: true

  # --------------------------------------------------------------------------
  # Vehicle search  (result is an array; the only PascalCase payload in the API)
  # --------------------------------------------------------------------------
  # The legacy API reads the search term from a `search` header, which is where a
  # search term least belongs. The bridge exposes it as a query parameter and moves it
  # into the header on the way out: GET /authorized-service/chassis-inquiry?serialNumber=...
  vehicle-search:
    method: GET
    exposedPath: /authorized-service/chassis-inquiry
    legacyPath: /yetkiliservis/SaseSorgulama
    legacyHeaders:
      search:
        fromQuery: serialNumber
        required: true
    response:
      unmapped: PASSTHROUGH_AND_REPORT
      fields:
        id: id
        SaseNo: chassisNo
        MotorNo: engineNo
        AracTipi: vehicleType
        Marka: brand
        Model: model
        # These arrive as numbers here but as strings on the work order line, for what
        # looks like the same option set — and both are now exposed under the same
        # names, so the type difference is visible in the contract. Part of A29.
        MotorHacmi: engineVolume
        YakitTuru: fuelType
        Sene: year
        LastikMarka: tireBrand
        LastikEbat: tireSize
