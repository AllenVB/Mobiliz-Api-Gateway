# Document, accessory and file endpoints of the legacy "Yetkili Servis" API.
#
# NAMING STATUS — read before editing an exposed name.
#
#   Every name below comes from the team's English vocabulary as published in Notion on
#   2026-08-24, applied EXACTLY as written. Where their spelling is inconsistent with
#   their own other names, theirs is kept and the discrepancy is raised instead — see
#   docs/open-items.md. Inventing a name they did not write would be worse.
#
#   PATHS are the vocabulary's own, adopted on the team's instruction: the legacy paths
#   translated into English, with no version segment. A22 is closed.
#
#   Still not covered by the vocabulary: the send-status-command body (A16).

resources:

  # --------------------------------------------------------------------------
  # Accessory installation document
  # --------------------------------------------------------------------------
  # The collection lists this URL twice, as `get document` and as `update accessory`.
  # They are the same endpoint: `PUT /yetkiliservis/dokuman`. Called with a body it
  # answers with a document link; called without one it answers 411 Length Required,
  # which is why the `get document` entry looks broken.
  #
  # It is a lookup performed with PUT — the legacy API's choice, not ours. The
  # exposed contract keeps the method so the semantics are not misrepresented, but
  # names it for what it actually does.
  #
  # NOTE the legacy key `detayid`: lower-case `id`, unlike `detayId` everywhere else.
  accessory-document:
    method: PUT
    exposedPath: /authorized-service/document
    legacyPath: /yetkiliservis/dokuman
    request:
      unmapped: FAIL
      fields:
        aksesuarId: accessoryId
        aksesuarAdi: accessoryName
        detayid: detailId
        durumu: status
    response:
      unmapped: PASSTHROUGH_AND_REPORT
      fields:
        link: link

  # --------------------------------------------------------------------------
  # File attachment upload
  # --------------------------------------------------------------------------
  # The file travels as base64 inside a JSON body rather than as multipart. That
  # inflates the payload by about a third and holds the whole file in memory on both
  # sides; worth raising with the team, but the bridge relays it as-is.
  #
  # No successful response captured — the attempt was made without the token header.
  file-upload:
    method: POST
    exposedPath: /authorized-service/file-attachment/{detailId}
    legacyPath: /yetkiliservis/dosyaeki/{detailId}
    request:
      unmapped: FAIL
      fields:
        icerik: content
        mimeType: mimeType
        dosyaAdi: fileName
