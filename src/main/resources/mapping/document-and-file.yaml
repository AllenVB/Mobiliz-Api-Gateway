# Document, accessory and file endpoints of the legacy "Yetkili Servis" API.
#
# NAMING STATUS — read before editing an exposed name.
#
#   Every name below comes from the team's English vocabulary as published in Notion on
#   2026-08-24, applied EXACTLY as written. Where their spelling is inconsistent with
#   their own other names, theirs is kept and the discrepancy is raised instead — see
#   docs/open-items.md. Inventing a name they did not write would be worse.
#
#   PATHS are the vocabulary's own, adopted on the team's instruction: the legacy paths
#   translated into English, with no version segment. A22 is closed.
#
#   Still not covered by the vocabulary: the send-status-command body (A16).

resources:

  # --------------------------------------------------------------------------
  # Installation document lookup
  # --------------------------------------------------------------------------
  # ⚠ THE CAPTURE AND THE VOCABULARY DISAGREE ABOUT THIS BODY.
  #
  # The collection sends `{aksesuarId, aksesuarAdi, detayid, durumu}` here and gets a
  # document link back — that is a real, captured, successful exchange. The revised
  # vocabulary says the body is `{brandId, modelId, documentType}`, an entirely
  # different set, and gives the accessory fields to `/aksesuarlar/` instead.
  #
  # Both can be true at once if this endpoint ignores fields it does not recognise,
  # which is exactly what `sendstatuscommand` was shown to do. That would mean the
  # captured call "worked" while sending the wrong body — returning some default
  # document rather than the one asked for.
  #
  # NO REQUEST MAPPING IS DECLARED, because neither shape can be trusted: the
  # vocabulary's has no legacy names to map from, and the capture's may never have
  # been read. The body relays untranslated until this is settled. Raised as A36.
  #
  # It is a lookup performed with PUT — the legacy API's choice, not ours.
  document-lookup:
    method: PUT
    exposedPath: /authorized-service/document
    legacyPath: /yetkiliservis/dokuman
    response:
      unmapped: PASSTHROUGH_AND_REPORT
      fields:
        link: link

  # --------------------------------------------------------------------------
  # Accessories of a work order line
  # --------------------------------------------------------------------------
  # NEW in the revised vocabulary, and a legacy endpoint this project had never seen:
  # `/yetkiliservis/aksesuarlar/`. The collection's `get accessories` points at
  # `/combolar` — the dropdown endpoint — which is why it returned the reference data
  # and looked like a duplicate of it. It was simply the wrong URL.
  #
  # The read answers with an empty array in the vocabulary's example, so no element
  # names are known and no response mapping can be written yet. Part of A36.
  accessories:
    method: GET
    exposedPath: /authorized-service/accessories/{detailId}
    legacyPath: /yetkiliservis/aksesuarlar/{detailId}

  # The write takes the four fields the collection had been sending to `/dokuman`.
  # Their legacy names are known from that capture; whether this endpoint uses the
  # same ones is not confirmed, since no call to `/aksesuarlar/` has ever been made.
  #
  # NOTE the legacy key `detayid`: lower-case `id`, unlike `detayId` everywhere else.
  # It is carried as captured — if this endpoint spells it the ordinary way, the
  # mapping is one character wrong and the coverage report will say so.
  accessory-update:
    method: PUT
    exposedPath: /authorized-service/accessories/{accessoryId}
    legacyPath: /yetkiliservis/aksesuarlar/{accessoryId}
    request:
      unmapped: FAIL
      fields:
        aksesuarId: accessoryId
        aksesuarAdi: accessoryName
        detayid: detailId
        durumu: status

  # --------------------------------------------------------------------------
  # File attachment upload
  # --------------------------------------------------------------------------
  # The file travels as base64 inside a JSON body rather than as multipart. That
  # inflates the payload by about a third and holds the whole file in memory on both
  # sides; worth raising with the team, but the bridge relays it as-is.
  #
  # No successful response captured — the attempt was made without the token header.
  file-upload:
    method: POST
    exposedPath: /authorized-service/file-attachment/{detailId}
    legacyPath: /yetkiliservis/dosyaeki/{detailId}
    request:
      unmapped: FAIL
      fields:
        icerik: content
        mimeType: mimeType
        dosyaAdi: fileName
