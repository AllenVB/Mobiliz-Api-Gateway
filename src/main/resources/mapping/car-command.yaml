# Car Command endpoints of the legacy "Yetkili Servis" API.
#
# NAMING STATUS — read before editing an exposed name.
#
#   Every name below comes from the team's English vocabulary as published in Notion on
#   2026-08-24, applied EXACTLY as written. Where their spelling is inconsistent with
#   their own other names, theirs is kept and the discrepancy is raised instead — see
#   docs/open-items.md. Inventing a name they did not write would be worse.
#
#   PATHS remain the resource-oriented ones chosen here; the vocabulary translates the
#   legacy paths instead (/authorized-service/...). That is A22.
#
#   Still not covered by the vocabulary: the send-status-command body (A16).

resources:

  # --------------------------------------------------------------------------
  # Immobilizer: read and write share one legacy path, split by method.
  # --------------------------------------------------------------------------
  # NOTE: the legacy field is `durum`, which elsewhere in this API means "status" and
  # holds a code. Here it is a plain boolean. This project exposed it as `active` to
  # keep the two apart; the team's agreed vocabulary calls it `status`, and the agreed
  # name won. The trap is still real — the same legacy name means two different things
  # in two places — so the glossary must never override an explicit per-resource mapping.
  immobilizer-status:
    method: GET
    exposedPath: /api/v1/work-order-lines/{detailId}/immobilizer
    legacyPath: /yetkiliservis/immobilizercheck/{detailId}
    response:
      unmapped: PASSTHROUGH_AND_REPORT
      fields:
        durum: status

  immobilizer-update:
    method: PUT
    exposedPath: /api/v1/work-order-lines/{detailId}/immobilizer
    legacyPath: /yetkiliservis/immobilizercheck/{detailId}
    request:
      unmapped: FAIL
      fields:
        durum: status
    # THE TWO SOURCES DISAGREE about what this write returns. The capture shows
    # `result: null`, which the bridge turns into 204 No Content; the vocabulary
    # documents `result: {"status": true}`, an echo of what was just set.
    #
    # The mapping below covers both without choosing: it is consulted only when a
    # payload actually arrives, so a null result still becomes a 204 and a `durum`
    # result is translated rather than passed through in Turkish. Raised as A31.
    response:
      unmapped: PASSTHROUGH_AND_REPORT
      fields:
        durum: status

  # --------------------------------------------------------------------------
  # Vehicle command
  # --------------------------------------------------------------------------
  # The captured attempt was rejected by the platform with the dotted error code
  # `notsupported.commands.iotplatform.error`, so the request shape is confirmed
  # but the set of accepted commands is not.
  #
  # Both `komut`/`komutid` and `durum`/`durumid` arrive as a label plus its code.
  # The codes are numeric strings; the labels are free text ("siren", "on").
  send-car-command:
    method: PUT
    exposedPath: /api/v1/work-order-lines/{detailId}/car-command
    legacyPath: /yetkiliservis/sendcarcommand/{detailId}
    request:
      unmapped: FAIL
      fields:
        # Each of these is a label paired with its code. This project grouped them into
        # objects (`command.name` + `command.code`) so a third attribute could be added
        # later without changing what already exists; the agreed vocabulary is flat and
        # the agreed name won. The response vocabulary has since arrived and is flat too,
        # so the contract is at least consistent with itself. E15 records the trade-off.
        komut: command
        komutid: commandId
        durum: status
        durumid: statusId

  # --------------------------------------------------------------------------
  # Status command
  # --------------------------------------------------------------------------
  # The URL is confirmed, the body is NOT: the capture was sent without one and
  # answered 411 Length Required.
  #
  # Deliberately declared with no `request` block. The route, the token header and
  # the envelope handling all work; the body is relayed to the legacy API unchanged
  # until a real sample exists. That means callers must currently send the legacy
  # field names for this one endpoint — the only place in the bridge where that is
  # true, and it is tracked in docs/open-items.md.
  send-status-command:
    method: PUT
    exposedPath: /api/v1/work-order-lines/{detailId}/status-command
    legacyPath: /yetkiliservis/sendstatuscommand/{detailId}
