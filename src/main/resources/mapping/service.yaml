# Service endpoints of the legacy "Yetkili Servis" API.
#
# NAMING STATUS — read before editing an exposed name.
#
#   Every name below comes from the team's English vocabulary as published in Notion,
#   revised 2026-08-24, applied EXACTLY as written. Where their spelling is inconsistent
#   with their own other names, theirs is kept and the discrepancy is raised instead —
#   see docs/open-items.md. Inventing a name they did not write would be worse.
#
#   PATHS are the vocabulary's own, adopted on the team's instruction: the legacy paths
#   translated into English, with no version segment. A22 is closed.

resources:

  # --------------------------------------------------------------------------
  # Service detail, read
  # --------------------------------------------------------------------------
  # A34 CLOSED by the revised vocabulary. The first successful capture (2026-08-24)
  # showed sixteen fields, five of which had no agreed name; the revision names all
  # sixteen, and renames four that the earlier draft had called something else:
  #
  #   cableWiringUnderMaintenance → cableInstallationUnderMaintenance
  #   maintenanceAccessory1/2/3   → accessory1/2/3UnderMaintenance
  #
  # The shape is four pairs — a part's current state and its under-maintenance state —
  # followed by the diagnosis block. `varise` is kept as the vocabulary spells it; it
  # is not an English word and is presumably meant to carry the legacy `varisegps`.
  service-detail:
    method: GET
    exposedPath: /authorized-service/service-detail/{detailId}
    legacyPath: /yetkiliservis/servisdetay/{detailId}
    response:
      unmapped: PASSTHROUGH_AND_REPORT
      fields:
        # Current state of each part.
        cihaz: device
        kablotesisat: cableInstallation
        gsm: gsm
        varisegpsanten: variseGpsAntenna

        # The same four, as taken in for maintenance.
        bakimdakicihaz: deviceUnderMaintenance
        bakimdakikablotesisat: cableInstallationUnderMaintenance
        bakimdakigsm: gsmUnderMaintenance
        bakimdakivarisegpsanten: variseGpsAntennaUnderMaintenance
        bakimdakiaksesuar1: accessory1UnderMaintenance
        bakimdakiaksesuar2: accessory2UnderMaintenance
        bakimdakiaksesuar3: accessory3UnderMaintenance

        # Diagnosis and resolution.
        sorununkaynagi: problemSource
        sorununkaynagidetay: problemSourceDetail
        cozumdetay: solutionDetail

        resimyukle: uploadImage
        # A numeric code; its list is unknown. See docs/open-items.md.
        kargodurumu: cargoStatus

  # --------------------------------------------------------------------------
  # Service detail, write
  # --------------------------------------------------------------------------
  # The revised vocabulary documents the request body as the SAME sixteen fields the
  # response carries, where the earlier draft listed only eleven. The five that were
  # missing are the four current-state flags and `bakimdakivarisegpsanten` — exactly
  # the gap raised as A34, now closed from the other side too.
  #
  # NOTE what this fixes: the two operations below no longer share a legacy endpoint.
  # The maintenance write goes to `/teknikservisbirim/`, not `/servisdetay/` — the
  # collection had it pointed at the wrong URL, which is what made them look like one
  # endpoint told apart by its body. Recorded against F13.
  service-detail-update:
    method: PUT
    exposedPath: /authorized-service/service-detail/{detailId}
    legacyPath: /yetkiliservis/servisdetay/{detailId}
    request:
      unmapped: FAIL
      fields:
        cihaz: device
        kablotesisat: cableInstallation
        gsm: gsm
        varisegpsanten: variseGpsAntenna

        bakimdakicihaz: deviceUnderMaintenance
        bakimdakikablotesisat: cableInstallationUnderMaintenance
        bakimdakigsm: gsmUnderMaintenance
        bakimdakivarisegpsanten: variseGpsAntennaUnderMaintenance
        bakimdakiaksesuar1: accessory1UnderMaintenance
        bakimdakiaksesuar2: accessory2UnderMaintenance
        bakimdakiaksesuar3: accessory3UnderMaintenance

        sorununkaynagi: problemSource
        sorununkaynagidetay: problemSourceDetail
        cozumdetay: solutionDetail

        resimyukle: uploadImage
        kargodurumu: cargoStatus

  # --------------------------------------------------------------------------
  # Technical service unit — shipment details, write
  # --------------------------------------------------------------------------
  # Its own legacy endpoint, `/yetkiliservis/teknikservisbirim/{detayId}`, given by the
  # revised vocabulary. Every capture went to `/servisdetay/` because that is where the
  # collection points it; that URL answered without complaint, which is presumably the
  # same "accepts anything" behaviour seen elsewhere in this API. The vocabulary's URL
  # is used here because it is the one the team says is right, and it also resolves the
  # shared-endpoint defect.
  service-maintenance-update:
    method: PUT
    exposedPath: /authorized-service/technical-service-unit/{detailId}
    legacyPath: /yetkiliservis/teknikservisbirim/{detailId}
    request:
      unmapped: FAIL
      fields:
        # A numeric string code selecting the carrier; `kargofirmasidiger` carries a
        # free-text name when the code means "other". Arrived as "" rather than null.
        kargofirmasi: cargoCompany
        kargofirmasidiger:
          exposed: cargoCompanyOther
          emptyStringAsNull: true
        kargotakipno: cargoTrackingNo
