# Service endpoints of the legacy "Yetkili Servis" API.
#
# NAMING STATUS — read before editing an exposed name.
#
#   Every name below comes from the team's English vocabulary as published in Notion on
#   2026-08-24, applied EXACTLY as written. Where their spelling is inconsistent with
#   their own other names, theirs is kept and the discrepancy is raised instead — see
#   docs/open-items.md. Inventing a name they did not write would be worse.
#
#   PATHS remain the resource-oriented ones chosen here; the vocabulary translates the
#   legacy paths instead (/authorized-service/...). That is A22.
#
#   Still not covered by the vocabulary: the send-status-command body (A16).

resources:

  # --------------------------------------------------------------------------
  # Service detail, read
  # --------------------------------------------------------------------------
  # No successful response has been captured: both attempts were made without the
  # token header and came back "Token Bilgisi Eksik". Declaring no response mapping
  # means the payload is relayed untranslated until a real sample exists, which is
  # visible rather than silently wrong.
  service-detail:
    method: GET
    exposedPath: /api/v1/services/{detailId}
    legacyPath: /yetkiliservis/servisdetay/{detailId}

  # --------------------------------------------------------------------------
  # Service detail, write
  # --------------------------------------------------------------------------
  # ⚠ THIS AND `service-maintenance-update` BELOW SHARE ONE LEGACY ENDPOINT.
  # Both are PUT /yetkiliservis/servisdetay/{detayId}; the legacy API tells them
  # apart only by which fields the body carries. That is fragile — a client sending
  # both sets at once would get undefined behaviour — and is reported to the team.
  #
  # The bridge gives them two distinct exposed paths so callers cannot conflate
  # them, and each declares `unmapped: FAIL` so a body mixing the two sets is
  # rejected here rather than at the legacy API.
  service-detail-update:
    method: PUT
    exposedPath: /api/v1/services/{detailId}
    legacyPath: /yetkiliservis/servisdetay/{detailId}
    request:
      unmapped: FAIL
      fields:
        # Which parts were taken in for maintenance.
        bakimdakicihaz: deviceUnderMaintenance
        bakimdakikablotesisat: cableWiringUnderMaintenance
        bakimdakigsm: gsmUnderMaintenance
        bakimdakiaksesuar1: maintenanceAccessory1
        bakimdakiaksesuar2: maintenanceAccessory2
        bakimdakiaksesuar3: maintenanceAccessory3

        # Diagnosis and resolution, free text in the capture.
        sorununkaynagi: problemSource
        sorununkaynagidetay: problemSourceDetail
        cozumdetay: solutionDetail

        resimyukle: uploadImage
        # A numeric code; its list is unknown. See docs/open-items.md.
        kargodurumu: cargoStatus

  # --------------------------------------------------------------------------
  # Maintenance shipment details, write
  # --------------------------------------------------------------------------
  # Same legacy endpoint as above — see the warning there.
  service-maintenance-update:
    method: PUT
    exposedPath: /api/v1/services/{detailId}/maintenance
    legacyPath: /yetkiliservis/servisdetay/{detailId}
    request:
      unmapped: FAIL
      fields:
        # A numeric string code selecting the carrier; `kargofirmasidiger` carries a
        # free-text name when the code means "other". Arrived as "" rather than null.
        kargofirmasi: cargoCompany
        kargofirmasidiger:
          exposed: cargoCompanyOther
          emptyStringAsNull: true
        kargotakipno: cargoTrackingNo
