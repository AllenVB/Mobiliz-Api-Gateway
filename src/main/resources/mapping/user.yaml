# User endpoints of the legacy "Yetkili Servis" API.
#
# NAMING STATUS — read before editing an exposed name.
#
#   Every name below comes from the team's English vocabulary as published in Notion on
#   2026-08-24, applied EXACTLY as written. Where their spelling is inconsistent with
#   their own other names, theirs is kept and the discrepancy is raised instead — see
#   docs/open-items.md. Inventing a name they did not write would be worse.
#
#   PATHS remain the resource-oriented ones chosen here; the vocabulary translates the
#   legacy paths instead (/authorized-service/...). That is A22.
#
#   Still not covered by the vocabulary: the send-status-command body (A16).

resources:

  # --------------------------------------------------------------------------
  # Consent update  (listed in the collection as "update privacy policy")
  # --------------------------------------------------------------------------
  # The two flags are the same consents login reports, minus the audience prefix:
  # login returns YSKVKK / YSETK / SatisKVKK / SatisETK, this endpoint takes plain
  # KVKK / ETK and applies them to the signed-in user.
  #
  # KVKK is Turkey's data-protection law and ETK its electronic-commerce law. This
  # project had exposed them by what they mean rather than by the statute; the agreed
  # vocabulary keeps the acronyms — `KVKK` / `ETK` here, `ysKvkk` / `ysEtk` in the login
  # response — so the acronyms are what the contract carries. Note the two spellings of
  # the same concept between the two endpoints; that is theirs, not a slip here.
  #
  # The legacy path is `/kullanici` (user) with no identifier: the subject is
  # whoever the token belongs to. The exposed path says so explicitly.
  user-consents-update:
    method: PUT
    exposedPath: /api/v1/users/me/consents
    legacyPath: /yetkiliservis/kullanici
    request:
      unmapped: FAIL
      fields:
        KVKK: KVKK
        ETK: ETK
