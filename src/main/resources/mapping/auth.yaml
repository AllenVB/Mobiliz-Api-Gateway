# Auth endpoints of the legacy "Yetkili Servis" API.
#
# Reading the file: the key is always the legacy (Turkish) name, the value is the name
# this bridge exposes. A dot in the exposed name groups the field into a nested object.
# A field may instead be written in long form to add `type`, `values`, `nested` or
# `emptyStringAsNull`.
#
# `type` declares the type of the *exposed* field and exists for legacy values that
# arrive quoted; translating back renders the canonical string form. Declare it only
# for fields the legacy API sends as strings.

# NAMING STATUS — read before editing an exposed name.
#
#   This file is DONE. Both auth endpoints' requests and responses come from the team's
#   English vocabulary as published in Notion on 2026-08-24, applied exactly as written.
#   The other mapping files still carry proposals for their response fields.
#
#   PATHS are the vocabulary's own, adopted on the team's instruction: the legacy paths
#   translated into English, with no version segment. A22 is closed.
#
# Two open questions were raised with the team against this file (A25, A26 in
# docs/open-items.md): `username` here contradicts `userName` in the earlier PDF, and
# `fullname` is the one name in the response that is not camelCase. Both are applied as
# the team wrote them rather than corrected, so the contract matches their document.

resources:

  auth-login:
    method: POST
    exposedPath: /authorized-service/login
    legacyPath: /yetkiliservis/giris
    # This is how a caller obtains a token, so it cannot require one.
    authentication: NONE

    request:
      # Our contract, our field names: anything we do not recognise is a client error.
      unmapped: FAIL
      fields:
        kullaniciAdi: username
        sifre: password
        deviceToken: deviceToken
        osversiyon:
          # Holds "IOS" / "ANDROID" — a platform, not a version, despite the legacy name.
          # The table also makes any unexpected value visible in the coverage report.
          exposed: osVersion
          values:
            IOS: IOS
            ANDROID: ANDROID

    # The team's vocabulary is flat throughout. This project had grouped three sets of
    # fields into objects — `role.code`/`role.description`, `appVersions.*`, `consents.*` —
    # so that a later addition (a role's permissions, a consent's timestamp) would be a new
    # field rather than a breaking change. The agreed names are flat and the agreed names
    # win; the trade-off is recorded once in E15, not argued again per field.
    response:
      unmapped: PASSTHROUGH_AND_REPORT
      fields:
        token: token
        # Not `fullName`: the vocabulary spells it with a lower-case n, alone among these
        # names. Applied as written rather than silently corrected — see A26.
        adSoyad: fullname
        rol: role
        rolAciklama: roleDescription
        qr: qr

        androidversion: androidVersion
        iosversion: iosVersion
        satisandroidversion: salesAndroidVersion
        satisiosversion: salesIosVersion

        # YS = Yetkili Servis, Satis = Sales. The vocabulary keeps the Turkish statute
        # acronyms rather than naming what they mean: KVKK is the data-privacy consent,
        # ETK the electronic-marketing one.
        YSKVKK: ysKvkk
        YSETK: ysEtk
        SatisKVKK: salesKvkk
        SatisETK: salesEtk

  auth-password-reset-request:
    method: POST
    exposedPath: /authorized-service/forgot-password
    legacyPath: /yetkiliservis/sifremiunuttum
    authentication: NONE

    request:
      unmapped: FAIL
      fields:
        kullaniciAdi: username

    # No response mapping, and none is needed: both the capture and the team's vocabulary
    # show `result: null`. There is nothing to translate. This is the settled shape, not a
    # placeholder.

  # --------------------------------------------------------------------------
  # Logout
  # --------------------------------------------------------------------------
  # New in the revised vocabulary. No body and no payload; the token is invalidated
  # upstream. The collection lists it as a GET, the vocabulary as a PUT — the
  # vocabulary is followed, since the team owns the contract and a logout does change
  # state. Raised as A35 in case the collection is the one that is right.
  #
  # `authentication: TOKEN` is deliberate even though it may look redundant: logging
  # out without saying who you are is not a request this bridge should forward.
  auth-logout:
    method: PUT
    exposedPath: /authorized-service/logout
    legacyPath: /yetkiliservis/cikis
