spring:
  application:
    name: ys-bridge

server:
  port: 8080

ys-bridge:
  legacy:
    # Deliberately has no default. A bridge with no upstream is useless, so the service
    # refuses to start rather than accepting traffic it cannot serve.
    base-url: ${YS_LEGACY_BASE_URL:}
    connect-timeout: 5s
    read-timeout: 15s
  mapping:
    locations:
      - classpath*:mapping/*.yaml
  pagination:
    # Collections are always paged. The legacy API does not paginate — it answers with whole
    # collections, one of which is about a megabyte — so the gateway pages on its own side.
    default-size: 100
    max-size: 500
  limits:
    # Attachments travel as base64 inside JSON, which inflates them by roughly a third.
    max-request-body: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.mobiliz.ysbridge: INFO

    # Pinned so that turning the root logger up to DEBUG — which is the first thing anyone
    # does when diagnosing a problem — does not put credentials in the log. Both of these
    # write whole message bodies at DEBUG, and the bodies passing through this service
    # include the login password, the session token, and the DVR stream URL, which carries
    # a Mobiliz-Token in its query string.
    #
    # Nothing this service logs itself carries payload data; these two are Spring's own.
    # Anyone who genuinely needs body logging can still raise these by name, which is a
    # deliberate act rather than a side effect of a blanket DEBUG.
    org.springframework.web.client.DefaultRestClient: INFO
    org.springframework.web.servlet.mvc.method.annotation: INFO
